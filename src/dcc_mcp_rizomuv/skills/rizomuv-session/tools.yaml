tools:
  - name: get_status
    description: Report RizomUVLink availability, the discovered executable, headless readiness, and workspace roots.
    source_file: scripts/get_status.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}

  - name: get_capabilities
    description: List supported input formats, unwrapping operations, and the safety boundaries of the headless runtime.
    source_file: scripts/get_capabilities.py
    input_schema: {type: object, properties: {}, additionalProperties: false}
    output_schema: {type: object}
    execution: sync
    affinity: any
    enforce_thread_affinity: true
    timeout_hint_secs: 60
    annotations: {read_only_hint: true, destructive_hint: false, idempotent_hint: true, open_world_hint: false, deferred_hint: false}
